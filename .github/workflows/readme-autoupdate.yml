name: 🔄 Auto-update README

on:
  schedule:
    # Every 6 hours — picks up new repos, descriptions, stars and languages
    - cron: "0 */6 * * *"
  push:
    branches: [main, master]
    paths-ignore:            # don't retrigger on the bot's own commit
      - "README.md"
      - "assets/**"
  workflow_dispatch:          # Run manually from the Actions tab
  repository_dispatch:        # Or trigger instantly from any other repo (see SETUP.md)
    types: [refresh-readme]

permissions:
  contents: write

# Never let a scheduled run and a push run fight over the same push
concurrency:
  group: readme-autoupdate
  cancel-in-progress: false

jobs:
  update:
    name: Rebuild README sections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Fails with a human-readable message instead of a bare "exit code 2"
      - name: Preflight — are the files where the workflow expects them?
        run: |
          echo "Working directory: $(pwd)"
          echo "--- repo root ---"
          ls -la
          echo "--- scripts/ ---"
          ls -la scripts 2>/dev/null || echo "(no scripts/ directory)"

          missing=0
          for f in README.md scripts/update_projects.py scripts/update_activity.py scripts/generate_cards.py; do
            if [ -f "$f" ]; then
              echo "OK      $f"
            else
              echo "MISSING $f"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::Required files are missing from the repository. Commit the scripts/ directory to the default branch — 'python: can't open file' is what produces exit code 2."
            exit 1
          fi

      - name: Regenerate stat cards (self-hosted SVGs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: getsurajmittal
        run: python3 scripts/generate_cards.py

      - name: Rebuild featured projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: getsurajmittal
          EXCLUDE_REPOS: getsurajmittal
          CARD_COUNT: "4"
          TABLE_COUNT: "6"
        run: python3 scripts/update_projects.py

      - name: Rebuild activity feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: getsurajmittal
          MAX_LINES: "10"
        run: python3 scripts/update_activity.py

      - name: Show what changed
        run: git --no-pager diff --stat -- README.md assets || true

      - name: Commit and push if changed
        run: |
          git add -A README.md assets
          if git diff --staged --quiet; then
            echo "Nothing changed — no commit needed."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto-update README and stat cards 🤖"

          branch="${GITHUB_REF_NAME}"
          echo "Pushing to $branch"
          # Rebase in case something else landed while we were running
          git pull --rebase --autostash origin "$branch" || true
          git push origin "HEAD:$branch"
