name: 🐍 Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # Twice a day, so the snake always matches your graph
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Platane/snk still ships a Node 20 runtime, so this job logs the same
      # deprecation warning. It is a warning, not an error — the action works.
      - name: Generate snake animations
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00F5D4
            dist/ocean.gif?color_snake=#00F5D4&color_dots=#0d1117,#164e46,#00816f,#00c4a7,#00f5d4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to the "output" branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
